# nginx serving the vite build on Cloud Run. Static files only: the browser
# talks to the API directly on its own origin, so there is no /api/ proxy
# here (see src/... for how VITE_API_URL, baked in at build time, is used).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # vite hashes these filenames, so a given URL's content never changes and
    # can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is the one filename that stays the same across deploys, and
    # it points at the hashed bundles. Caching it would serve an old app
    # asking for assets that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Client-side router handles all paths: anything that isn't a real file
    # must fall back to index.html, or a refresh on a deep link 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
