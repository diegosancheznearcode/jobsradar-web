name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@diegosancheznearcode"

      # @diegosancheznearcode/contracts se publica desde jobsradar-api a
      # GitHub Packages (ver ARCHITECTURE.md sección 9 y README). Como
      # jobsradar-api es privado, leer su paquete requiere un token con
      # permiso de lectura sobre paquetes de ese repo — el mismo secret
      # JOBSRADAR_API_RO_TOKEN que ya se usaba para el checkout sibling,
      # ahora con el permiso "Packages: Read-only" agregado (Settings →
      # Developer settings → Fine-grained tokens, en el token existente).
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.JOBSRADAR_API_RO_TOKEN }}

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build
