name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TODO(Fase 1→2): @jobsradar/contracts todavía se consume como
      # dependencia local (file:../jobsradar-api/packages/contracts, ver
      # ARCHITECTURE.md sección 9 y README). Este checkout de jobsradar-api
      # como sibling es lo que lo hace resoluble en CI. Cuando el paquete se
      # publique a un registro real (GitHub Packages / npm privado), borrar
      # este step y volver a `pnpm add @jobsradar/contracts@<version>`.
      - uses: actions/checkout@v4
        with:
          repository: <ORG>/jobsradar-api # TODO: reemplazar cuando exista el remoto
          path: jobsradar-api-sibling

      - name: Symlink sibling repo a la ruta que espera el file: dependency
        run: |
          cd ..
          ln -s "$GITHUB_WORKSPACE/jobsradar-api-sibling" jobsradar-api

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build @jobsradar/contracts (dependencia local)
        working-directory: ../jobsradar-api
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @jobsradar/contracts build

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build
